# Alembic configuration for the AEGIS backend.
#
# The database connection is NOT configured here. migrations/env.py builds it
# from the AEGIS_DATABASE_* environment variables (app.core.config.Settings),
# so credentials never appear in this file or in version control.
#
# Run from apps/backend, for example:
#   alembic upgrade head
#   alembic revision --autogenerate -m "add example table"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# WARNING keeps SQL statements and parameters out of the output.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
