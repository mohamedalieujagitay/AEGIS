# Continuous integration (DECISIONS D-015, D-048, D-058; SYSTEM_ARCHITECTURE §14.5).
#
# Runs linting, formatting checks, type checking, import-boundary contracts
# and tests for the backend and the frontend, then builds the container
# images and runs the Compose smoke test.
#
# Security:
# - Read-only token; no secrets are used. Runs on `pull_request` (never
#   `pull_request_target`), so code from forks gets no write access or secrets.
# - Third-party actions are pinned to full commit hashes (tag in the comment).
# - Database tests use a disposable PostgreSQL cluster created by the test
#   harness on 127.0.0.1 inside the runner. No external database is used.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same pull request or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock

      - name: Install PostgreSQL 18 server binaries
        # From the PostgreSQL project's apt repository (signed). No cluster or
        # service is created: the test harness creates its own temporary one.
        working-directory: .
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          echo "create_main_cluster = false" | sudo tee -a /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-18
          /usr/lib/postgresql/18/bin/postgres --version

      - name: Install dependencies (locked, hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Lint (Ruff)
        run: ruff check --output-format=github .

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Lint, format and type check the infrastructure scripts
        working-directory: infrastructure
        run: |
          ruff check scripts
          ruff format --check scripts
          mypy --strict --python-version 3.11 scripts/init_dev_secrets.py scripts/smoke_test.py

      - name: Check import boundaries (import-linter)
        run: lint-imports

      - name: Run tests (pytest)
        env:
          AEGIS_TEST_POSTGRES_BIN: /usr/lib/postgresql/18/bin
          # Fail, instead of skipping, if the database tests cannot run.
          AEGIS_TEST_REQUIRE_POSTGRES: "1"
        run: python -m pytest

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  containers:
    name: Containers (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds both images locally and runs the stack as the separate Compose
      # project "aegis-smoke" with temporary secrets, then removes it. Images
      # are never pushed or uploaded (D-059). Only the Python standard library
      # and the runner's Docker are used.
      - name: Build images and run the smoke test
        run: python3 infrastructure/scripts/smoke_test.py --build
