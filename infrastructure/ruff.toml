# Ruff settings for the infrastructure scripts: the backend's rules
# (apps/backend/pyproject.toml), except that these command-line tools print
# their results.
extend = "../apps/backend/pyproject.toml"

[lint.per-file-ignores]
"scripts/*.py" = ["T201"]
# Tests use plain asserts and fixed, non-secret placeholder passwords (as in apps/backend).
"tests/*.py" = ["S101", "S105"]
