# AEGIS frontend server (DECISIONS.md D-052).
#
# Serves the built single-page application and proxies /api/ to the backend,
# so the browser only ever talks to one origin (no CORS; cookie sessions and
# CSRF protection in Phase 02 rely on this).
#
# Included inside the http block of the image's nginx.conf.

# Do not disclose the nginx version. The Server header still says "nginx";
# removing it entirely needs a third-party module.
server_tokens off;

# Docker's embedded DNS. The backend's address is resolved at request time,
# so nginx follows the backend if its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Routine health probes (GET or HEAD, answered with 200 or 503) are not
# written to the access log; every other request, including probe errors,
# is (DECISIONS.md D-060).
map "$request_method $uri $status" $aegis_access_log {
    "~^(GET|HEAD) /api/v1/health/(live|ready) (200|503)$" 0;
    default 1;
}

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log main if=$aegis_access_log;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's limit (AEGIS_MAX_REQUEST_BODY_BYTES, 1 MiB).
    client_max_body_size 1m;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;

        # Replace, never append to, any forwarding headers sent by the client.
        # The backend trusts them only from this container's address
        # (uvicorn --forwarded-allow-ips).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;

        # API responses carry their own headers; the browser-facing security
        # headers are added only to the application's own responses below.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single-page application: unknown paths are handled by the client router.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
