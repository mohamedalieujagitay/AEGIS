# Valkey configuration for AEGIS (DECISIONS.md D-055). Contains no secrets:
# users and password hashes are in the ACL file, a Docker secret generated by
# infrastructure/scripts/init_dev_secrets.py.

# Reachable only on the internal "queue" network; no host port is published.
bind 0.0.0.0
port 6379
protected-mode yes

# ACL users: the default user is disabled; each role has its own user,
# restricted to its own commands and keys (SYSTEM_ARCHITECTURE §6.6).
aclfile /run/secrets/valkey_users.acl

# Queued jobs survive a Valkey restart. Valkey is not the permanent store for
# assessment evidence (§2.4); results go to PostgreSQL through the backend.
dir /data
appendonly yes
appendfsync everysec
save ""

# Queues must never be evicted to free memory: refuse writes instead.
maxmemory 256mb
maxmemory-policy noeviction

# Administrative surface stays closed (these are also the defaults).
enable-debug-command no
enable-module-command no
enable-protected-configs no

# Close idle client connections after 5 minutes; detect dead peers.
timeout 300
tcp-keepalive 60

loglevel notice
